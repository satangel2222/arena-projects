<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projects</title>
<style>
  :root { color-scheme: dark; }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#050506; color:#fff;
    font-family:'Helvetica Neue',Inter,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; align-items:center;
    padding:14vh 28px 10vh;
  }
  h1{
    font-weight:200; font-size:11px; letter-spacing:.62em; text-indent:.62em;
    color:rgba(255,255,255,.30); text-transform:uppercase; margin:0 0 64px;
  }
  #grid{ width:100%; max-width:760px; display:grid; gap:2px; }
  a.card{
    display:block; text-decoration:none; color:inherit;
    padding:26px 24px; border-radius:14px;
    background:linear-gradient(90deg, rgba(255,255,255,.028), rgba(255,255,255,0));
    border:1px solid rgba(255,255,255,.055);
    transition:background .35s ease, border-color .35s ease, transform .35s cubic-bezier(.4,0,.2,1);
    position:relative; overflow:hidden;
  }
  a.card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:2px;
    background:var(--a,#fff); opacity:.55; transition:opacity .35s ease, width .35s ease;
  }
  a.card:hover{ background:rgba(255,255,255,.045); border-color:rgba(255,255,255,.16); transform:translateX(4px); }
  a.card:hover::before{ opacity:1; width:3px; }
  .t{ font-weight:200; font-size:26px; letter-spacing:.26em; text-indent:.26em; }
  .s{ margin-top:9px; font-family:ui-monospace,'SF Mono',Menlo,monospace;
      font-size:8.5px; letter-spacing:.34em; color:rgba(255,255,255,.42); text-transform:uppercase; }
  .m{ margin-top:16px; font-family:ui-monospace,'SF Mono',Menlo,monospace;
      font-size:8px; letter-spacing:.16em; color:rgba(255,255,255,.24); }
  #empty{ font:300 12px/1.9 ui-monospace,monospace; letter-spacing:.2em; color:rgba(255,255,255,.3); }
  footer{
    margin-top:72px; font-family:ui-monospace,monospace; font-size:8px;
    letter-spacing:.4em; color:rgba(255,255,255,.16);
  }
</style>
</head>
<body>
  <h1>Projects</h1>
  <div id="grid"><p id="empty">LOADING…</p></div>
  <footer id="count"></footer>
<script type="module">
  const grid = document.getElementById('grid');
  try {
    const res = await fetch('./projects.json?t=' + Date.now());
    const list = await res.json();
    grid.innerHTML = '';
    if (!list.length) { grid.innerHTML = '<p id="empty">NO PROJECTS YET</p>'; }
    for (const p of list) {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = p.href || ('./' + p.id + '/');
      a.style.setProperty('--a', p.accent || '#fff');
      a.innerHTML = `<div class="t">${p.title}</div>
        <div class="s">${p.sub || ''}</div>
        <div class="m">${p.meta || ''}</div>`;
      grid.appendChild(a);
    }
    document.getElementById('count').textContent = list.length + ' PROJECT' + (list.length === 1 ? '' : 'S');
  } catch (e) {
    grid.innerHTML = '<p id="empty">projects.json MISSING</p>';
  }
</script>
</body>
</html>
